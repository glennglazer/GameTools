# GameTools TES — Cross-platform release build
#
# Trigger: push a tag matching tes-v* (e.g.  git tag tes-v1.0.0 && git push --tags)
#
# Produces two artifacts uploaded to a GitHub Release:
#   GameTools_TES_<version>_Setup.exe    (Windows installer via NSIS)
#   GameTools_TES_<version>_macOS.dmg   (macOS, Apple Silicon native; runs on Intel via Rosetta 2)
#
# IMPORTANT: No Anthropic credentials are stored here or bundled into the
# executables.  Users supply their own API key on first run.

name: Build TES Release

on:
  push:
    tags:
      - 'tes-v*'

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Windows Intel
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (Intel)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#tes-v}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r TES/executables/src/requirements.txt nuitka zstandard

      - name: Compile with Nuitka (standalone directory)
        # --onefile is NOT used: it extracts to %TEMP% at runtime, which means
        # sys.argv[0] no longer points at the data files, causing a silent crash.
        # --standalone produces a directory tree that NSIS installs wholesale.
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --windows-console-mode=force \
            --windows-icon-from-ico=TES/executables/assets/gametools.ico \
            --include-data-dir=TES/executables/src/ui=ui \
            --include-data-dir=TES/mcp=rag \
            --include-data-files=TES/database/gametools.sqlite3=data/gametools.sqlite3 \
            --output-filename=GameToolsTES.exe \
            --output-dir=build_out \
            --assume-yes-for-downloads \
            --nofollow-import-to=uvloop \
            --nofollow-import-to=websockets \
            --nofollow-import-to=httptools \
            --include-module=h11 \
            --include-module=asyncio.windows_events \
            TES/executables/src/main.py

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build NSIS installer
        # Use PowerShell (not bash) to avoid Git Bash MSYS path conversion.
        # All paths passed to makensis must be absolute (NSIS expands
        # ${__FILEDIR__} relative to whatever path form the script is given).
        # Use the full path to makensis.exe rather than relying on PATH — the
        # Chocolatey install doesn't propagate to subsequent steps reliably.
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path dist_out | Out-Null

          # Find the Nuitka standalone output directory (named from input file: main.dist)
          $StandaloneDir = (Get-ChildItem -Path "build_out" -Filter "*.dist" -Directory |
                            Select-Object -First 1).FullName
          if (-not $StandaloneDir) {
            Write-Error "No .dist directory found in build_out/"
            exit 1
          }
          Write-Host "Standalone dir: $StandaloneDir"

          # Resolve makensis.exe — Chocolatey always installs to Program Files (x86)
          $NsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $NsisExe)) {
            Write-Error "makensis.exe not found at $NsisExe"
            exit 1
          }
          Write-Host "NSIS: $NsisExe"

          $NsiScript = (Join-Path (Get-Location) "TES\executables\scripts\wintel\gametools_tes.nsi")
          $OutDir    = (Join-Path (Get-Location) "dist_out")
          & "$NsisExe" `
            "/DVERSION=$VERSION" `
            "/DSRC_DIR=$StandaloneDir" `
            "/DOUT_DIR=$OutDir" `
            "$NsiScript"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename installer artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mv "dist_out/GameTools_TES_Setup_${VERSION}.exe" \
             "dist_out/GameTools_TES_${VERSION}_Setup.exe" || true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist_out/GameTools_TES_*_Setup.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # macOS (Apple Silicon native; runs on Intel Macs via Rosetta 2)
  # macos-13 (Intel runner) was retired by GitHub; a single ARM build covers
  # both architectures because macOS Rosetta 2 is transparent for this app.
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 (arm64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#tes-v}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          pip install -r TES/executables/src/requirements.txt nuitka zstandard
          brew install create-dmg || true

      - name: Compile with Nuitka
        # --standalone + --macos-create-app-bundle is the correct mode.
        # --output-filename names the binary INSIDE the bundle; the bundle
        # directory itself is named from the input file (main.py → main.app).
        # We detect and rename it in the next step.
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name="GameTools TES" \
            --macos-app-version="${{ steps.version.outputs.VERSION }}" \
            --macos-app-icon=TES/executables/assets/gametools.icns \
            --include-data-dir=TES/executables/src/ui=ui \
            --include-data-dir=TES/mcp=rag \
            --include-data-files=TES/database/gametools.sqlite3=data/gametools.sqlite3 \
            --output-filename=GameToolsTES \
            --output-dir=build_out \
            --assume-yes-for-downloads \
            --enable-plugin=anti-bloat \
            TES/executables/src/main.py

      - name: Locate, rename, sign, and package DMG
        # Nuitka names the bundle from the input module (main.py → main.app),
        # not --output-filename.  Rename to "GameTools TES.app" so users see
        # the proper name in their Applications folder.
        run: |
          echo "=== Nuitka output ==="
          find build_out -maxdepth 4 | sort

          APP_BUNDLE=$(find build_out -name "*.app" -maxdepth 2 -type d | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "ERROR: no .app bundle found in build_out/"
            exit 1
          fi
          echo "Found: $APP_BUNDLE"

          # Rename to the user-visible name if Nuitka used a different name
          FINAL_BUNDLE="$(dirname "$APP_BUNDLE")/GameTools TES.app"
          if [ "$APP_BUNDLE" != "$FINAL_BUNDLE" ]; then
            mv "$APP_BUNDLE" "$FINAL_BUNDLE"
          fi
          echo "Using: $FINAL_BUNDLE"

          codesign --deep --force --sign "-" "$FINAL_BUNDLE" || true

          mkdir -p dist_out
          VERSION="${{ steps.version.outputs.VERSION }}"
          create-dmg \
            --volname "GameTools TES" \
            --volicon "TES/executables/assets/gametools.icns" \
            --window-size 540 360 \
            --icon-size 128 \
            --icon "GameTools TES.app" 140 180 \
            --app-drop-link 400 180 \
            "dist_out/GameTools_TES_${VERSION}_macOS.dmg" \
            "$FINAL_BUNDLE" || \
          hdiutil create -volname "GameTools TES" \
            -srcfolder "$FINAL_BUNDLE" \
            -ov -format UDZO \
            "dist_out/GameTools_TES_${VERSION}_macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist_out/GameTools_TES_*_macOS.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Parse version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#tes-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: Add README to release assets
        run: cp TES/executables/README.md release_assets/README.md

      - name: Create Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          name: "GameTools TES v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## GameTools TES v${{ steps.version.outputs.VERSION }}

            Crafting assistant for Morrowind, Oblivion, and Skyrim.

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows 10/11 (x64) | `GameTools_TES_${{ steps.version.outputs.VERSION }}_Setup.exe` |
            | macOS (Apple Silicon + Intel via Rosetta 2) | `GameTools_TES_${{ steps.version.outputs.VERSION }}_macOS.dmg` |

            📄 **See `README.md` in this release for installation instructions and first-time setup.**

            ### First-time setup
            1. Install the app for your platform (see README for OS security prompts)
            2. Launch GameTools TES — your browser opens automatically
            3. Click ⚙ Settings and enter your [Anthropic API key](https://console.anthropic.com)
            4. Start asking questions!

            > **Your API key is never included in this release.** It is stored in your
            > OS credential store (Windows Credential Manager / macOS Keychain) after you enter it.
          files: |
            release_assets/**/*.exe
            release_assets/**/*.dmg
            release_assets/README.md
