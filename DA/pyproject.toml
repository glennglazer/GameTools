[tool.pytest.ini_options]
# importlib mode: each test file gets a path-derived unique module name.
# Awakening test files are prefixed with test_aw_* and Origins files with
# plain names so basenames are globally unique across both test suites.
addopts = "--import-mode=importlib"
pythonpath = [
    "tests/unittests",
    "tests/integrationtests",
]
